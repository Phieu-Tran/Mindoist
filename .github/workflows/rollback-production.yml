name: Rollback production code

on:
  workflow_dispatch:
    inputs:
      previous_sha:
        description: 'Known-good product SHA or retained snapshot ref'
        required: true
      confirm:
        description: 'Type ROLLBACK-PRODUCTION to pass the safety gate'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.30.0'
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  rollback:
    name: production code rollback (no down migration)
    if: inputs.confirm == 'ROLLBACK-PRODUCTION'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.previous_sha }}
      - name: Require explicit rollback enablement
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: test "$PRODUCTION_DEPLOY_ENABLED" = true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Supabase CLI
        run: npm install --global supabase@${{ env.SUPABASE_CLI_VERSION }}
      - name: Redeploy previous Edge code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy jobs-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Rebuild and redeploy previous web code
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          pnpm --filter @mindoist/design-tokens build
          pnpm --filter @mindoist/shared build
          pnpm --filter web build
          npx --yes wrangler@4.49.1 pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
      - name: Smoke after rollback
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
          SUPABASE_API_URL: ${{ vars.SUPABASE_API_URL }}
        run: |
          curl --fail --retry 3 --retry-delay 2 "$PAGES_URL"
          curl --fail --retry 3 --retry-delay 2 "$SUPABASE_API_URL/functions/v1/api/health"
      - name: Explicitly state database policy
        run: echo 'Code-only rollback completed. No Prisma down migration or automatic database restore was executed.'
