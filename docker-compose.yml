services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindoist_user
      POSTGRES_PASSWORD: mindoist_pass
      POSTGRES_DB: mindoist_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindoist_user -d mindoist_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
