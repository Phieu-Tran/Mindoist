name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact SHA already green in CI and staging'
        required: true
      confirm:
        description: 'Type DEPLOY-PRODUCTION to pass the second safety gate'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.30.0'
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  deploy:
    name: production (manual approval)
    if: inputs.confirm == 'DEPLOY-PRODUCTION'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Production safety gate
        shell: bash
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_API_URL: ${{ vars.SUPABASE_API_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_SF0_JOB_SECRET: ${{ secrets.PRODUCTION_SF0_JOB_SECRET }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_DEPLOY_ENABLED" = true || { echo 'Set production variable PRODUCTION_DEPLOY_ENABLED=true only after the cutover rehearsal.'; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || true
          for name in SUPABASE_PROJECT_REF SUPABASE_API_URL VITE_API_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT PAGES_URL SUPABASE_ACCESS_TOKEN MIGRATION_DATABASE_URL CLOUDFLARE_API_TOKEN PRODUCTION_SF0_JOB_SECRET; do
            if [ -z "${!name:-}" ]; then echo "Missing production variable/secret: $name"; exit 1; fi
          done
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Supabase CLI
        run: npm install --global supabase@${{ env.SUPABASE_CLI_VERSION }}
      - name: Apply additive migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm --filter api prisma migrate deploy
      - name: Deploy Edge Functions with Cron unchanged
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy jobs-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Remote synthetic smoke
        env:
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_API_URL }}/functions/v1
          SF0_JOB_SECRET: ${{ secrets.PRODUCTION_SF0_JOB_SECRET }}
        run: pnpm supabase:smoke-local
      - name: Build web for production
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          pnpm --filter @mindoist/design-tokens build
          pnpm --filter @mindoist/shared build
          pnpm --filter web build
      - name: Deploy web to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@4.49.1 pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
      - name: Attach production custom domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains"
          domain='mindoist.workspacesbeat.site'
          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$endpoint" | jq -r --arg domain "$domain" '.result[] | select(.name == $domain) | .name' | head -n 1)"
          if [[ -z "$existing" ]]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$domain\"}" \
              "$endpoint" >/dev/null
            echo "Attached $domain to Pages production."
          else
            echo "$domain is already attached to Pages production."
          fi
      - name: Production Pages smoke
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: curl --fail --retry 3 --retry-delay 2 --connect-timeout 10 "$PAGES_URL"
      - name: Record deployment manifest
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          cat > deployment-manifest.json <<EOF
          {"environment":"production","sourceSha":"${{ inputs.source_sha }}","workflowRun":"${GITHUB_RUN_ID}","supabaseProjectRef":"${SUPABASE_PROJECT_REF}","pagesUrl":"${PAGES_URL}","migration":"prisma migrate deploy","syntheticSmoke":"passed","cron":"enable only after this manifest is reviewed"}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: production-deployment-manifest-${{ github.run_id }}
          path: deployment-manifest.json
          retention-days: 90
