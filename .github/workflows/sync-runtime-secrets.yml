name: Sync Supabase runtime secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment whose secrets should be synced'
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: 'Type SYNC-RUNTIME-SECRETS to pass the safety gate'
        required: true

permissions:
  contents: read

concurrency:
  group: sync-runtime-secrets-${{ inputs.environment }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  sync:
    name: sync ${{ inputs.environment }} runtime secrets
    if: inputs.confirm == 'SYNC-RUNTIME-SECRETS'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected secret inputs
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          set -euo pipefail
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN JWT_SECRET JOBS_SECRET; do
            if [ -z "${!name:-}" ]; then echo "Missing runtime variable/secret: $name"; exit 1; fi
          done
          test "${#JWT_SECRET}" -ge 32
          test "${#JOBS_SECRET}" -ge 24
      - name: Install Supabase CLI
        run: npm install --global supabase@${{ env.SUPABASE_CLI_VERSION }}
      - name: Sync only SF0 runtime secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          set -euo pipefail
          supabase secrets set \
            "JWT_SECRET=$JWT_SECRET" \
            "JOBS_SECRET=$JOBS_SECRET" \
            "SF0_FEATURES=1" \
            --project-ref "$SUPABASE_PROJECT_REF"
          echo 'Runtime secret names synced; values were not printed.'
