name: Mindoist CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.30.0'
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindoist/api prisma generate
      - run: pnpm --filter @mindoist/design-tokens build
      - run: pnpm --filter @mindoist/shared build
      - run: pnpm --filter @mindoist/api lint
      - run: pnpm --filter @mindoist/web lint

  unit:
    name: unit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindoist_user
          POSTGRES_PASSWORD: mindoist_pass
          POSTGRES_DB: mindoist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mindoist_user -d mindoist_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindoist/api prisma generate
      - run: pnpm --filter @mindoist/design-tokens build
      - run: pnpm --filter @mindoist/shared build
      - run: pnpm --filter @mindoist/design-tokens test
      - run: pnpm --filter @mindoist/shared test
      - run: pnpm --filter @mindoist/api test
      - run: pnpm --filter @mindoist/web test

  build-bundle:
    name: build-bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindoist/design-tokens build
      - run: pnpm --filter @mindoist/shared build
      - run: pnpm --filter @mindoist/api build
      - run: pnpm --filter @mindoist/web build
      - name: Check product bundle exists and is bounded
        shell: bash
        run: |
          test -f apps/web/dist/index.html
          bundle_kb="$(du -sk apps/web/dist | cut -f1)"
          echo "web bundle: ${bundle_kb} KiB"
          test "$bundle_kb" -lt 204800

  edge-db:
    name: edge-db
    runs-on: ubuntu-24.04
    env:
      SF0_JOB_SECRET: ci-sf0-job-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm supabase:start
      - name: Apply Prisma migrations to local Supabase
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
        run: pnpm --filter @mindoist/api prisma migrate deploy
      - name: Serve Edge Functions with synthetic-only secrets
        shell: bash
        run: |
          cat > supabase/functions/.env <<'EOF'
          SF0_FEATURES=1
          SF0_DIAGNOSTICS=1
          JWT_SECRET=ci-sf0-jwt-secret
          JOBS_SECRET=ci-sf0-job-secret
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55432/postgres
          EOF
          nohup npx --yes supabase@${SUPABASE_CLI_VERSION} functions serve --no-verify-jwt \
            > "$RUNNER_TEMP/supabase-functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/supabase-functions.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:55421/functions/v1/api/health >/dev/null \
              && curl --silent --fail --request POST \
                --header "x-job-secret: $SF0_JOB_SECRET" \
                http://127.0.0.1:55421/functions/v1/jobs-reminders >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/supabase-functions.log"
          exit 1
      - run: pnpm supabase:check-local
      - run: pnpm supabase:smoke-local
      - run: pnpm supabase:check-dependencies
      - name: Upload Edge logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-edge-logs
          path: ${{ runner.temp }}/supabase-functions.log
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  contract:
    name: contract
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, edge-db]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migration inventory and function entrypoints
        shell: bash
        run: |
          migrations="$(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$migrations" -gt 0
          test -f supabase/functions/api/index.ts
          test -f supabase/functions/jobs-reminders/index.ts
          echo "Prisma migrations: $migrations"
          echo "SF0 Edge entrypoints present"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    needs: [build-bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindoist/design-tokens build
      - run: pnpm --filter @mindoist/shared build
      - run: pnpm --filter @mindoist/api build
      - run: pnpm --filter @mindoist/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 3

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit (critical gate)
        run: pnpm audit --prod --audit-level critical
      - name: High-severity dependency report
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level high
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '::warning::High-severity dependency advisories are reported above; upgrade work remains tracked separately.'
          fi
          exit 0
      - name: Tracked-secret guard
        shell: bash
        run: |
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|sb_secret_[A-Za-z0-9]+|service_role_key\s*[:=]' -- \
            ':!docs/**' ':!**/*.md' ':!**/.env.example'; then
            echo 'A credential-like value was found in tracked product files.'
            exit 1
          fi
