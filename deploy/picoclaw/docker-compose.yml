name: mindoist-picoclaw

services:
  picoclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PICOCLAW_COMMIT: 2992eccbf03e54258a6889cf19a5a4fe6255895f
    image: mindoist/picoclaw:0.2.9-mindoist
    restart: unless-stopped
    environment:
      MINDOIST_INTERNAL_URL: ${MINDOIST_INTERNAL_URL:-http://host.docker.internal:3000}
      MINDOIST_AGENT_TOKEN_FILE: /run/secrets/mindoist_agent_token
      MINDOIST_AI_CONFIG_URL: ${MINDOIST_AI_CONFIG_URL:-http://host.docker.internal:3000/internal/agent/ai-config}
      PICOCLAW_AI_SYNC_INTERVAL_SECONDS: ${PICOCLAW_AI_SYNC_INTERVAL_SECONDS:-60}
      PICOCLAW_CONFIG: /root/.picoclaw/config.json
      PICOCLAW_HOME: /root/.picoclaw
      PICOCLAW_LOG_LEVEL: ${PICOCLAW_LOG_LEVEL:-warn}
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - mindoist_agent_token
    volumes:
      - picoclaw-data:/root/.picoclaw
      - type: bind
        source: ./.security.yml
        target: /etc/picoclaw/bootstrap.security.yml
        read_only: true
        bind:
          create_host_path: false
    mem_limit: ${PICOCLAW_MEMORY_LIMIT:-512m}
    cpus: ${PICOCLAW_CPU_LIMIT:-0.75}
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:18790/health || exit 1]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  picoclaw-data:

secrets:
  mindoist_agent_token:
    file: ./.agent-token
